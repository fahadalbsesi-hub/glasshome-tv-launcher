plugins { id 'com.android.application' }

// Release signing: ../signing/keystore.properties (kept out of the source, back it up!)
def signingProps = new Properties()
def signingFile = rootProject.file('../signing/keystore.properties')
if (signingFile.exists()) signingFile.withInputStream { signingProps.load(it) }

android {
    namespace 'com.glasshome.tv'
    compileSdk 34
    defaultConfig {
        applicationId 'com.glasshome.tv'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0.0'
    }
    signingConfigs {
        release {
            if (signingFile.exists()) {
                storeFile new File(signingFile.parentFile, signingProps['storeFile'])
                storePassword signingProps['storePassword']
                keyAlias signingProps['keyAlias']
                keyPassword signingProps['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint { abortOnError false; checkReleaseBuilds false }
}

dependencies {
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
}
